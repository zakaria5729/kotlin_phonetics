name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "phonetics/**"
      - "phonetics-compose/**"
      - "sample-compose/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web demo
        run: ./gradlew :sample-compose:wasmJsBrowserDistribution

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sample-compose/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
